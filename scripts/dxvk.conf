# Gamify defaults for DXVK 1.10.3 (CrossOver's fork), installed as runtimes/dxvk/dxvk.conf
# and read through DXVK_CONFIG_FILE. A dxvk.conf next to a game's .exe is NOT read when
# DXVK_CONFIG_FILE is set, so per-game options go here or in a per-bottle copy.
# All options: upstream/crossover-sources-25.1.0/sources/dxvk/dxvk.conf.
#
# Async shader compilation: this DXVK tree has no `dxvk.enableAsync` (that is the
# out-of-tree dxvk-async patch, shipped e.g. by Gcenx's DXVK-macOS). It stays OFF here:
# it hides shader stutter but draws with missing shaders for a few frames, and some
# anti-cheat systems have flagged it. Do not add it for online games.
# dxvk.enableAsync = False

# Triple buffering, as in CrossOver's dxvk.conf.
dxgi.numBackBuffers = 3

# Keep DXVK's pipeline state cache (dxvk.stateCachePath defaults to the exe's directory).
dxvk.enableStateCache = True

# Uncomment to see what DXVK is doing (fps, frame times, device name).
# dxvk.hud = fps,devinfo
